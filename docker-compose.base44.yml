services:
  web:
    image: node:22-bookworm
    working_dir: /app
    command:
      - sh
      - -ec
      - npm install --no-audit --no-fund --prefer-offline && exec npm run dev -- --host 0.0.0.0 --port 5173
    ports:
      - "3000:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - BASE44_PREVIEW_MODE
      - BASE44_SANDBOX_HOST_DOMAIN
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 120s
    restart: on-failure
